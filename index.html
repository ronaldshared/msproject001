<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gantt Chart - WELLMONT-11 (réplica)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f0f0f0; padding: 20px; }
  h1 { margin-bottom: 15px; color: #333; }
  .gantt-container { background: white; border: 1px solid #ccc; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  
  table { border-collapse: collapse; width: 100%; min-width: 1400px; }
  th, td { border: 1px solid #ddd; padding: 6px 10px; font-size: 13px; }
  th { background: #e8e8e8; position: sticky; top: 0; z-index: 10; }
  
  .task-col { width: 280px; text-align: left; }
  .dur-col, .start-col, .finish-col { width: 90px; text-align: center; }
  
  .summary { font-weight: bold; background: #f8f8f8; }
  .level-1 { padding-left: 20px; }
  .level-2 { padding-left: 40px; }
  
  .timeline { position: relative; height: 28px; background: #fafafa; }
  .bar {
    position: absolute; height: 18px; top: 5px; border-radius: 3px;
    color: white; font-size: 11px; line-height: 18px; text-align: center;
    white-space: nowrap; overflow: hidden; cursor: pointer;
  }
  .bar:hover { opacity: 0.85; }
  
  .red    { background: #e74c3c; }
  .blue   { background: #3498db; }
  .cyan   { background: #1abc9c; }
  .black  { background: #2c3e50; }
  .milestone {
    width: 14px; height: 14px; background: #2c3e50;
    transform: rotate(45deg); top: 7px; border-radius: 2px;
  }
  
  .header-months { display: flex; background: #d0d0d0; }
  .month { flex: 1; text-align: center; padding: 4px; border-right: 1px solid #bbb; font-weight: bold; }
  
  .tooltip {
    position: absolute; background: #333; color: white; padding: 6px 10px;
    border-radius: 4px; font-size: 12px; z-index: 100; display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>WELLMONT-11 – Diagrama de Gantt (réplica HTML/CSS/JS)</h1>

<div class="gantt-container">
  <table id="ganttTable">
    <thead>
      <tr>
        <th class="task-col">Task Name</th>
        <th class="dur-col">Duration</th>
        <th class="start-col">Start</th>
        <th class="finish-col">Finish</th>
        <th>
          <div class="header-months">
            <div class="month">Junio 2019</div>
            <div class="month">Julio 2019</div>
            <div class="month">Agosto 2019</div>
            <div class="month">Septiembre 2019</div>
          </div>
        </th>
      </tr>
    </thead>
    <tbody id="ganttBody"></tbody>
  </table>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ===== DATOS EXTRAÍDOS DE LA IMAGEN (evidencia) =====
const tasks = [
  { id:1,  name:"Notice to Proceed",     duration:"0 days", start:"6/3/2019",  finish:"6/3/2019",  level:0, color:"black", isMilestone:true,  startDay:3,  days:0 },
  { id:2,  name:"Project Start",         duration:"0 days", start:"6/4/2019",  finish:"6/4/2019",  level:0, color:"black", isMilestone:true,  startDay:4,  days:0 },
  { id:3,  name:"Project Complete",      duration:"0 days", start:"9/10/2019", finish:"9/10/2019", level:0, color:"black", isMilestone:true,  startDay:99, days:0 },
  { id:4,  name:"Mobilization",          duration:"10 days",start:"6/5/2019",  finish:"6/20/2019", level:0, color:"red",   isMilestone:false, startDay:5,  days:10 },
  { id:5,  name:"Construction",          duration:"51 days",start:"6/24/2019", finish:"8/14/2019", level:0, color:"black", isMilestone:false, startDay:24, days:51, summary:true },
  { id:6,  name:"Below Grade",           duration:"13 days",start:"6/24/2019", finish:"7/11/2019", level:1, color:"black", isMilestone:false, startDay:24, days:13, summary:true },
  { id:7,  name:"Grade Site",            duration:"8 days", start:"6/24/2019", finish:"7/5/2019",  level:2, color:"blue",  isMilestone:false, startDay:24, days:8 },
  { id:8,  name:"Set Foundation",        duration:"9 days", start:"6/24/2019", finish:"7/8/2019",  level:2, color:"blue",  isMilestone:false, startDay:24, days:9 },
  { id:9,  name:"Dig Cable Trench",      duration:"4 days", start:"7/8/2019",  finish:"7/12/2019", level:2, color:"red",   isMilestone:false, startDay:38, days:4 },
  { id:10, name:"Above Grade",           duration:"20 days",start:"7/11/2019", finish:"8/14/2019", level:1, color:"black", isMilestone:false, startDay:41, days:20, summary:true },
  { id:11, name:"Erect Steel Structures",duration:"8 days", start:"7/11/2019", finish:"7/22/2019", level:2, color:"blue",  isMilestone:false, startDay:41, days:8 },
  { id:12, name:"Install Equipment",     duration:"6 days", start:"7/16/2019", finish:"7/24/2019", level:2, color:"cyan",  isMilestone:false, startDay:46, days:6 },
  { id:13, name:"Install Grounding",     duration:"2 days", start:"7/25/2019", finish:"7/26/2019", level:2, color:"cyan",  isMilestone:false, startDay:55, days:2 },
  { id:14, name:"Install Bus and Jumpers",duration:"8 days",start:"7/25/2019", finish:"8/7/2019",  level:2, color:"blue",  isMilestone:false, startDay:55, days:8 },
  { id:15, name:"Lay Control Cable",     duration:"7 days", start:"7/28/2019", finish:"8/7/2019",  level:2, color:"red",   isMilestone:false, startDay:58, days:7 },
  { id:16, name:"Fence",                 duration:"14 days",start:"7/28/2019", finish:"8/11/2019", level:1, color:"black", isMilestone:false, startDay:58, days:14, summary:true },
  { id:17, name:"Install Fence",         duration:"7 days", start:"7/28/2019", finish:"8/7/2019",  level:2, color:"blue",  isMilestone:false, startDay:58, days:7 },
  { id:18, name:"Site Restoration",      duration:"23 days",start:"8/15/2019", finish:"8/22/2019", level:1, color:"black", isMilestone:false, startDay:76, days:8, summary:true },
  { id:19, name:"Remove Equipment",      duration:"5 days", start:"8/15/2019", finish:"8/21/2019", level:2, color:"red",   isMilestone:false, startDay:76, days:5 },
  { id:20, name:"Lay Storing",           duration:"2 days", start:"7/16/2019", finish:"7/17/2019", level:2, color:"cyan",  isMilestone:false, startDay:46, days:2 },
  { id:21, name:"Lay Roadway",           duration:"4 days", start:"7/18/2019", finish:"7/23/2019", level:2, color:"cyan",  isMilestone:false, startDay:48, days:4 },
  { id:22, name:"Project Closeout",      duration:"10 days",start:"8/26/2019", finish:"9/10/2019", level:0, color:"black", isMilestone:false, startDay:87, days:10, summary:true },
  { id:23, name:"Substantial Completion",duration:"10 days",start:"8/26/2019", finish:"9/10/2019", level:1, color:"red",   isMilestone:false, startDay:87, days:10 }
];

// Escala: 1 día ≈ 4.2 px (ajustable)
const DAY_WIDTH = 4.2;
const START_OFFSET = 3; // 1 de junio = día 1

function renderGantt() {
  const tbody = document.getElementById('ganttBody');
  tbody.innerHTML = '';

  tasks.forEach(task => {
    const tr = document.createElement('tr');
    if (task.summary) tr.classList.add('summary');

    // Nombre
    const nameTd = document.createElement('td');
    nameTd.className = 'task-col level-' + task.level;
    nameTd.textContent = task.name;
    tr.appendChild(nameTd);

    // Duración
    const durTd = document.createElement('td');
    durTd.className = 'dur-col';
    durTd.textContent = task.duration;
    tr.appendChild(durTd);

    // Start
    const startTd = document.createElement('td');
    startTd.className = 'start-col';
    startTd.textContent = task.start;
    tr.appendChild(startTd);

    // Finish
    const finishTd = document.createElement('td');
    finishTd.className = 'finish-col';
    finishTd.textContent = task.finish;
    tr.appendChild(finishTd);

    // Timeline
    const timeTd = document.createElement('td');
    const timeline = document.createElement('div');
    timeline.className = 'timeline';

    const bar = document.createElement('div');
    if (task.isMilestone) {
      bar.className = 'bar milestone';
      bar.style.left = ((task.startDay - START_OFFSET) * DAY_WIDTH) + 'px';
    } else {
      bar.className = 'bar ' + task.color;
      bar.style.left = ((task.startDay - START_OFFSET) * DAY_WIDTH) + 'px';
      bar.style.width = (task.days * DAY_WIDTH) + 'px';
      if (task.days > 5) bar.textContent = task.name;
    }

    bar.addEventListener('mouseenter', (e) => showTooltip(e, task));
    bar.addEventListener('mouseleave', hideTooltip);

    timeline.appendChild(bar);
    timeTd.appendChild(timeline);
    tr.appendChild(timeTd);

    tbody.appendChild(tr);
  });
}

function showTooltip(e, task) {
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `<strong>${task.name}</strong><br>
                   Duración: ${task.duration}<br>
                   Inicio: ${task.start}<br>
                   Fin: ${task.finish}`;
  tip.style.display = 'block';
  tip.style.left = (e.pageX + 12) + 'px';
  tip.style.top = (e.pageY + 12) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

renderGantt();
</script>
</body>
</html>
