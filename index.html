<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WELLMONT-11 – MS Project Pro (Dependencias avanzadas + Recursos)</title>
<style>
  :root {
    --header-bg: #f3f3f3;
    --border: #c0c0c0;
    --critical: #e74c3c;
    --bar-blue: #5b9bd5;
    --summary: #2c3e50;
    --baseline: #9e9e9e;
    --overalloc: #ff5252;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#e8e8e8;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  .toolbar{background:#2b579a;color:#fff;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
  .toolbar button,.toolbar select{background:#3b6db0;color:#fff;border:1px solid #1e3f6f;padding:5px 10px;border-radius:3px;cursor:pointer}
  .toolbar button:hover{background:#4a7bc8}
  .toolbar .sep{width:1px;height:22px;background:#5a8ad0;margin:0 4px}

  .main{flex:1;display:flex;overflow:hidden}
  .left-panel{width:720px;background:#fff;border-right:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .right-panel{flex:1;overflow:auto;background:#fff;position:relative}

  .grid-header{display:grid;grid-template-columns:36px 1.6fr 65px 90px 90px 50px 110px 160px;background:var(--header-bg);border-bottom:1px solid var(--border);font-weight:600;font-size:12px;position:sticky;top:0;z-index:20}
  .grid-header>div{padding:7px 5px;border-right:1px solid var(--border)}

  .task-row{display:grid;grid-template-columns:36px 1.6fr 65px 90px 90px 50px 110px 160px;border-bottom:1px solid #e0e0e0;font-size:12.5px;height:30px;align-items:center}
  .task-row:hover{background:#f0f7ff}
  .task-row.selected{background:#d6eaf8}
  .task-row.summary{font-weight:600;background:#f7f7f7}
  .task-row .id{text-align:center;color:#666}
  .task-row .name{padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .timeline-header{display:flex;background:var(--header-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15;height:46px}
  .month-cell{border-right:1px solid var(--border);text-align:center;font-size:12px;font-weight:600;padding-top:4px}

  .bars-container{position:relative}
  .bar-row{height:30px;position:relative;border-bottom:1px solid #f0f0f0}
  .bar{position:absolute;height:16px;top:7px;border-radius:3px;color:#fff;font-size:11px;line-height:16px;text-align:center;cursor:move;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.2);overflow:hidden;white-space:nowrap;z-index:3}
  .bar.critical{background:var(--critical)!important}
  .bar.summary-bar{background:var(--summary);height:9px;top:10px}
  .bar .progress{position:absolute;left:0;top:0;height:100%;background:rgba(0,0,0,.28)}
  .milestone{width:12px;height:12px;background:#2c3e50;transform:rotate(45deg);top:9px}
  .baseline-bar{position:absolute;height:5px;top:22px;background:var(--baseline);border-radius:1px;opacity:.7;z-index:1}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;z-index:6;pointer-events:none}
  #depSvg{position:absolute;top:0;left:0;pointer-events:none;z-index:4}

  /* Resource View */
  .resource-view{display:none}
  .resource-view.active{display:block}
  .res-header{display:grid;grid-template-columns:200px 1fr;background:var(--header-bg);font-weight:600;padding:8px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .res-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid #eee;min-height:40px}
  .res-name{padding:10px;font-weight:600;background:#f8f8f8;border-right:1px solid var(--border);display:flex;align-items:center;gap:6px}
  .res-name.overallocated{background:#ffebee;color:#c62828}
  .res-timeline{position:relative;height:100%}
  .res-bar{position:absolute;height:16px;top:12px;border-radius:3px;font-size:11px;color:#fff;line-height:16px;padding:0 5px;overflow:hidden;white-space:nowrap;cursor:pointer}
  .res-bar.over{background:var(--overalloc)!important;border:1px solid #b71c1c}

  .gantt-view.hidden{display:none}
  .calendar-view{display:none;padding:16px}
  .calendar-view.active{display:block}

  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center}
  .modal.show{display:flex}
  .modal-content{background:#fff;padding:20px;border-radius:6px;width:560px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto}
  .modal-content h3{margin-bottom:12px}
  .modal-content label{display:block;margin:8px 0 2px;font-size:13px}
  .modal-content input,.modal-content select{width:100%;padding:6px;margin-bottom:6px}
  .pred-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .pred-row select,.pred-row input{width:auto}
  .modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

  .tooltip{position:fixed;background:#1e1e1e;color:#fff;padding:8px 12px;border-radius:4px;font-size:12px;z-index:200;display:none;max-width:320px;pointer-events:none;line-height:1.4}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="addTask()">+ Tarea</button>
  <button onclick="editSelected()">Editar</button>
  <button onclick="deleteSelected()">Eliminar</button>
  <div class="sep"></div>
  <button onclick="indentTask()">→ Indentar</button>
  <button onclick="outdentTask()">← Outdent</button>
  <div class="sep"></div>
  <button onclick="toggleExpandAll(true)">Expandir</button>
  <button onclick="toggleExpandAll(false)">Colapsar</button>
  <div class="sep"></div>
  <label>Escala:</label>
  <select id="scaleSelect" onchange="changeScale(this.value)">
    <option value="day">Día</option>
    <option value="week" selected>Semana</option>
    <option value="month">Mes</option>
  </select>
  <div class="sep"></div>
  <label>Filtro:</label>
  <select id="filterSelect" onchange="applyFilter(this.value)">
    <option value="all">Todas</option>
    <option value="critical">Solo críticas</option>
    <option value="incomplete">Incompletas</option>
    <option value="completed">Completadas</option>
    <option value="delayed">Retrasadas</option>
  </select>
  <div class="sep"></div>
  <button onclick="calculateCriticalPath()">Ruta Crítica</button>
  <button onclick="setBaseline()">Baseline</button>
  <button onclick="rescheduleAll()">Recalcular Fechas</button>
  <button onclick="exportCSV()">CSV</button>
  <button onclick="window.print()">PDF</button>
  <div class="sep"></div>
  <button onclick="switchView('gantt')">Gantt</button>
  <button onclick="switchView('resources')">Uso de Recursos</button>
  <button onclick="switchView('calendar')">Calendario</button>
  <div class="sep"></div>
  <button onclick="saveData()">💾 Guardar</button>
  <span id="status" style="margin-left:auto;font-size:12px;opacity:.85"></span>
</div>

<div class="main">
  <div class="left-panel">
    <div class="grid-header">
      <div>ID</div>
      <div>Nombre de tarea</div>
      <div>Duración</div>
      <div>Inicio</div>
      <div>Fin</div>
      <div>%</div>
      <div>Recurso</div>
      <div>Predecesoras</div>
    </div>
    <div id="taskList" style="overflow-y:auto;flex:1"></div>
  </div>

  <div class="right-panel" id="rightPanel">
    <!-- Gantt -->
    <div class="gantt-view" id="ganttView">
      <div class="timeline-header" id="timelineHeader"></div>
      <div class="bars-container" id="barsContainer">
        <svg id="depSvg"></svg>
      </div>
    </div>

    <!-- Resource Usage -->
    <div class="resource-view" id="resourceView">
      <div class="res-header">
        <div>Recurso</div>
        <div id="resTimelineHeader"></div>
      </div>
      <div id="resourceList"></div>
    </div>

    <!-- Calendar -->
    <div class="calendar-view" id="calendarView">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button onclick="changeCalMonth(-1)">‹ Anterior</button>
        <h2 id="calTitle"></h2>
        <button onclick="changeCalMonth(1)">Siguiente ›</button>
      </div>
      <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 id="modalTitle">Editar tarea</h3>
    <label>Nombre</label>
    <input type="text" id="mName">
    <label>Duración (días)</label>
    <input type="number" id="mDuration" min="0">
    <label>Inicio</label>
    <input type="date" id="mStart">
    <label>% Completado</label>
    <input type="number" id="mPercent" min="0" max="100">
    <label>Recurso (uno solo)</label>
    <input type="text" id="mResource" placeholder="Nombre del recurso">
    <label>Es tarea resumen</label>
    <select id="mSummary"><option value="false">No</option><option value="true">Sí</option></select>

    <label style="margin-top:14px">Predecesoras (Tipo + Lag)</label>
    <div id="predList"></div>
    <button onclick="addPredRow()" style="margin-top:6px">+ Añadir predecesora</button>

    <div class="modal-buttons">
      <button onclick="closeModal()">Cancelar</button>
      <button onclick="saveTask()" style="background:#2b579a;color:#fff">Guardar</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
/* ===================== DATOS ===================== */
let tasks = [
  {id:1, name:"Notice to Proceed", duration:0, start:"2019-06-03", percent:100, level:0, summary:false, resource:"Project Manager", preds:[], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:2, name:"Project Start", duration:0, start:"2019-06-04", percent:100, level:0, summary:false, resource:"Project Manager", preds:[{id:1,type:"FS",lag:0}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:3, name:"Project Complete", duration:0, start:"2019-09-10", percent:0, level:0, summary:false, resource:"", preds:[{id:22,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:4, name:"Mobilization", duration:10, start:"2019-06-05", percent:100, level:0, summary:false, resource:"Site Team", preds:[{id:2,type:"FS",lag:0}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:5, name:"Construction", duration:51, start:"2019-06-24", percent:60, level:0, summary:true, resource:"", preds:[{id:4,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:6, name:"Below Grade", duration:13, start:"2019-06-24", percent:100, level:1, summary:true, resource:"", preds:[], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:7, name:"Grade Site", duration:8, start:"2019-06-24", percent:100, level:2, summary:false, resource:"Civil Crew", preds:[], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:8, name:"Set Foundation", duration:9, start:"2019-06-24", percent:100, level:2, summary:false, resource:"Civil Crew", preds:[{id:7,type:"FS",lag:0}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:9, name:"Dig Cable Trench", duration:4, start:"2019-07-08", percent:100, level:2, summary:false, resource:"Electrical", preds:[{id:8,type:"FS",lag:0}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:10,name:"Above Grade", duration:20, start:"2019-07-11", percent:70, level:1, summary:true, resource:"", preds:[{id:6,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:11,name:"Erect Steel Structures", duration:8, start:"2019-07-11", percent:100, level:2, summary:false, resource:"Steel Crew", preds:[], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:12,name:"Install Equipment", duration:6, start:"2019-07-16", percent:80, level:2, summary:false, resource:"Mech. Team", preds:[{id:11,type:"FS",lag:0}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:13,name:"Install Grounding", duration:2, start:"2019-07-25", percent:50, level:2, summary:false, resource:"Electrical", preds:[{id:12,type:"SS",lag:2}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:14,name:"Install Bus and Jumpers", duration:8, start:"2019-07-25", percent:40, level:2, summary:false, resource:"Electrical", preds:[{id:12,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:15,name:"Lay Control Cable", duration:7, start:"2019-07-28", percent:30, level:2, summary:false, resource:"Electrical", preds:[{id:14,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:16,name:"Fence", duration:14, start:"2019-07-28", percent:20, level:1, summary:true, resource:"", preds:[], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:17,name:"Install Fence", duration:7, start:"2019-07-28", percent:20, level:2, summary:false, resource:"Fence Crew", preds:[], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:18,name:"Site Restoration", duration:8, start:"2019-08-15", percent:0, level:1, summary:true, resource:"", preds:[{id:10,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:19,name:"Remove Equipment", duration:5, start:"2019-08-15", percent:0, level:2, summary:false, resource:"Mech. Team", preds:[], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:20,name:"Lay Storing", duration:2, start:"2019-07-16", percent:100, level:2, summary:false, resource:"Civil Crew", preds:[], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:21,name:"Lay Roadway", duration:4, start:"2019-07-18", percent:100, level:2, summary:false, resource:"Civil Crew", preds:[{id:20,type:"FS",lag:0}], collapsed:false, critical:false, baselineStart:null, baselineDuration:null},
  {id:22,name:"Project Closeout", duration:10, start:"2019-08-26", percent:0, level:0, summary:true, resource:"", preds:[{id:18,type:"FS",lag:0}], collapsed:false, critical:true, baselineStart:null, baselineDuration:null},
  {id:23,name:"Substantial Completion", duration:10, start:"2019-08-26", percent:0, level:1, summary:false, resource:"Project Manager", preds:[], collapsed:false, critical:true, baselineStart:null, baselineDuration:null}
];

let selectedId = null;
let scale = 'week';
let dayWidth = 11;
let currentFilter = 'all';
let currentView = 'gantt';
let calYear = 2019, calMonth = 6;
let editingId = null;

/* ===== Utilidades de fecha ===== */
const parseDate = s => new Date(s+'T00:00:00');
const formatDate = d => d.toISOString().slice(0,10);
const addDays = (d,n) => {const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const getFinish = t => addDays(parseDate(t.start), t.duration);

/* ===== Cálculo de fechas según tipo de dependencia ===== */
function calculateStartFromPred(task, predTask, type, lag) {
  const pStart = parseDate(predTask.start);
  const pFinish = getFinish(predTask);
  let result;
  switch(type) {
    case 'FS': result = addDays(pFinish, lag); break;
    case 'SS': result = addDays(pStart, lag); break;
    case 'FF': result = addDays(addDays(pFinish, lag), -task.duration); break;
    case 'SF': result = addDays(addDays(pStart, lag), -task.duration); break;
    default: result = addDays(pFinish, lag);
  }
  return result;
}

function rescheduleAll() {
  // Orden topológico simple + propagación
  let changed = true;
  let safety = 0;
  while(changed && safety < 50) {
    changed = false;
    safety++;
    tasks.forEach(t => {
      if(!t.preds || t.preds.length === 0) return;
      let latest = null;
      t.preds.forEach(p => {
        const pred = tasks.find(x => x.id === p.id);
        if(!pred) return;
        const candidate = calculateStartFromPred(t, pred, p.type, p.lag || 0);
        if(!latest || candidate > latest) latest = candidate;
      });
      if(latest) {
        const newStart = formatDate(latest);
        if(newStart !== t.start) {
          t.start = newStart;
          changed = true;
        }
      }
    });
  }
  render();
  saveData();
  alert('Fechas recalculadas según dependencias');
}

/* ===== Filtro ===== */
function passesFilter(t) {
  if(currentFilter==='all') return true;
  if(currentFilter==='critical') return t.critical;
  if(currentFilter==='incomplete') return t.percent < 100;
  if(currentFilter==='completed') return t.percent === 100;
  if(currentFilter==='delayed') return t.baselineStart && parseDate(t.start) > parseDate(t.baselineStart);
  return true;
}
function applyFilter(v){currentFilter=v;render();}

/* ===== Render principal ===== */
function render() {
  if(currentView==='gantt'){renderTaskList();renderTimeline();drawDependencies();}
  else if(currentView==='resources'){renderResourceView();}
  else{renderCalendar();}
}

function renderTaskList() {
  const c = document.getElementById('taskList');
  c.innerHTML = '';
  tasks.forEach(t => {
    if(isHidden(t) || !passesFilter(t)) return;
    const row = document.createElement('div');
    row.className = 'task-row'+(t.summary?' summary':'')+(t.id===selectedId?' selected':'');
    row.onclick = ()=>{selectedId=t.id;render();};
    const indent = '&nbsp;'.repeat(t.level*3);
    const toggle = t.summary?`<span onclick="event.stopPropagation();toggleCollapse(${t.id})" style="cursor:pointer;margin-right:3px">${t.collapsed?'▶':'▼'}</span>`:'';
    const predText = (t.preds||[]).map(p=>`${p.id}${p.type}${p.lag?((p.lag>0?'+':'')+p.lag+'d'):''}`).join(', ')||'—';
    row.innerHTML = `
      <div class="id">${t.id}</div>
      <div class="name">${toggle}${indent}${t.name}</div>
      <div>${t.duration}d</div>
      <div>${t.start}</div>
      <div>${formatDate(getFinish(t))}</div>
      <div>${t.percent}%</div>
      <div>${t.resource||'—'}</div>
      <div title="${predText}">${predText}</div>`;
    c.appendChild(row);
  });
}

function isHidden(task) {
  let level = task.level;
  for(let i=tasks.indexOf(task)-1;i>=0;i--){
    if(tasks[i].level < level){
      if(tasks[i].collapsed) return true;
      level = tasks[i].level;
    }
  }
  return false;
}

function renderTimeline() {
  if(scale==='day') dayWidth=24;
  else if(scale==='week') dayWidth=11;
  else dayWidth=3.6;

  const header = document.getElementById('timelineHeader');
  const bars = document.getElementById('barsContainer');
  const svg = document.getElementById('depSvg');
  header.innerHTML = '';
  while(bars.children.length>1) bars.removeChild(bars.lastChild);

  const minD = parseDate('2019-06-01');
  const maxD = parseDate('2019-09-25');
  const totalDays = daysBetween(minD,maxD)+1;
  const totalWidth = totalDays*dayWidth;

  let html='', cur=new Date(minD);
  while(cur<=maxD){
    const label=cur.toLocaleString('es',{month:'short',year:'2-digit'});
    const days = scale==='month'?30:(scale==='week'?7:1);
    html+=`<div class="month-cell" style="width:${days*dayWidth}px">${label}</div>`;
    cur=addDays(cur,days);
  }
  header.innerHTML=html;
  header.style.width=totalWidth+'px';

  const visible=[];
  tasks.forEach(t=>{
    if(isHidden(t)||!passesFilter(t)) return;
    visible.push(t);
    const row=document.createElement('div');
    row.className='bar-row';
    row.style.width=totalWidth+'px';
    row.dataset.id=t.id;

    if(t.baselineStart){
      const bOff=daysBetween(minD,parseDate(t.baselineStart))*dayWidth;
      const bW=Math.max((t.baselineDuration||t.duration)*dayWidth,4);
      const base=document.createElement('div');
      base.className='baseline-bar';
      base.style.left=bOff+'px';
      base.style.width=bW+'px';
      row.appendChild(base);
    }

    const startOff=daysBetween(minD,parseDate(t.start))*dayWidth;
    const w=Math.max(t.duration*dayWidth,t.duration===0?12:6);
    const bar=document.createElement('div');
    bar.className='bar'+(t.duration===0?' milestone':'')+(t.summary?' summary-bar':'')+(t.critical?' critical':'');
    bar.style.left=startOff+'px';
    bar.style.width=(t.duration===0?12:w)+'px';
    bar.style.background=t.critical?'var(--critical)':(t.summary?'var(--summary)':'var(--bar-blue)');
    if(t.duration>0) bar.innerHTML=`<div class="progress" style="width:${t.percent}%"></div>${t.duration>4?t.name.substring(0,16):''}`;

    bar.onmousedown=e=>startDrag(e,t,bar,minD);
    bar.onmouseenter=e=>showTooltip(e,t);
    bar.onmouseleave=hideTooltip;
    row.appendChild(bar);
    bars.appendChild(row);
  });

  const todayX=daysBetween(minD,parseDate('2019-07-15'))*dayWidth;
  const line=document.createElement('div');
  line.className='today-line';
  line.style.left=todayX+'px';
  bars.appendChild(line);

  bars.style.width=totalWidth+'px';
  bars.style.height=(visible.length*30)+'px';
  svg.style.width=totalWidth+'px';
  svg.style.height=(visible.length*30)+'px';
}

/* ===== Flechas de dependencia ===== */
function drawDependencies() {
  const svg=document.getElementById('depSvg');
  svg.innerHTML='';
  const rows=[...document.querySelectorAll('.bar-row')];
  const idToIdx={};
  rows.forEach((r,i)=>idToIdx[r.dataset.id]=i);

  // marker
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>`;
  svg.appendChild(defs);

  tasks.forEach(t=>{
    if(!t.preds||isHidden(t)||!passesFilter(t)) return;
    t.preds.forEach(p=>{
      const pred=tasks.find(x=>x.id===p.id);
      if(!pred||isHidden(pred)||!passesFilter(pred)) return;
      const fromIdx=idToIdx[pred.id], toIdx=idToIdx[t.id];
      if(fromIdx===undefined||toIdx===undefined) return;

      const fromBar=rows[fromIdx].querySelector('.bar');
      const toBar=rows[toIdx].querySelector('.bar');
      if(!fromBar||!toBar) return;

      let x1,y1=fromIdx*30+15, x2,y2=toIdx*30+15;
      const fl=parseFloat(fromBar.style.left), fw=parseFloat(fromBar.style.width);
      const tl=parseFloat(toBar.style.left), tw=parseFloat(toBar.style.width);

      // según tipo de enlace
      if(p.type==='FS' || p.type==='FF'){x1=fl+fw;} else {x1=fl;}
      if(p.type==='FS' || p.type==='SS'){x2=tl;} else {x2=tl+tw;}

      const mid=x1+14;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M${x1},${y1} H${mid} V${y2} H${x2}`);
      path.setAttribute('stroke',t.critical?'#c0392b':'#555');
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('fill','none');
      path.setAttribute('marker-end','url(#arrow)');
      svg.appendChild(path);
    });
  });
}

/* ===== Vista de Recursos ===== */
function renderResourceView() {
  const list=document.getElementById('resourceList');
  const header=document.getElementById('resTimelineHeader');
  list.innerHTML='';

  const minD=parseDate('2019-06-01');
  const maxD=parseDate('2019-09-25');
  const totalDays=daysBetween(minD,maxD)+1;
  const totalWidth=totalDays*dayWidth;

  // header timeline
  let h='';
  let cur=new Date(minD);
  while(cur<=maxD){
    const label=cur.toLocaleString('es',{month:'short'});
    h+=`<span style="display:inline-block;width:${7*dayWidth}px;text-align:center;border-right:1px solid #ccc">${label}</span>`;
    cur=addDays(cur,7);
  }
  header.innerHTML=`<div style="width:${totalWidth}px">${h}</div>`;

  // agrupar por recurso
  const resMap={};
  tasks.forEach(t=>{
    if(!t.resource||t.summary) return;
    if(!resMap[t.resource]) resMap[t.resource]=[];
    resMap[t.resource].push(t);
  });

  Object.keys(resMap).sort().forEach(resName=>{
    const tasksOfRes=resMap[resName];
    // detectar overlapping → overallocation
    let over=false;
    for(let i=0;i<tasksOfRes.length;i++){
      for(let j=i+1;j<tasksOfRes.length;j++){
        const a=tasksOfRes[i], b=tasksOfRes[j];
        const aS=parseDate(a.start), aF=getFinish(a);
        const bS=parseDate(b.start), bF=getFinish(b);
        if(aS<bF && bS<aF){over=true;break;}
      }
    }

    const row=document.createElement('div');
    row.className='res-row';
    const nameDiv=document.createElement('div');
    nameDiv.className='res-name'+(over?' overallocated':'');
    nameDiv.innerHTML=over?`⚠ ${resName}`:resName;
    row.appendChild(nameDiv);

    const timeline=document.createElement('div');
    timeline.className='res-timeline';
    timeline.style.width=totalWidth+'px';
    timeline.style.height='40px';

    tasksOfRes.forEach(t=>{
      const left=daysBetween(minD,parseDate(t.start))*dayWidth;
      const w=Math.max(t.duration*dayWidth,8);
      const bar=document.createElement('div');
      bar.className='res-bar'+(over?' over':'');
      bar.style.left=left+'px';
      bar.style.width=w+'px';
      bar.style.background=t.critical?'var(--critical)':'var(--bar-blue)';
      bar.textContent=t.name.substring(0,20);
      bar.title=`${t.name}\n${t.start} → ${formatDate(getFinish(t))}`;
      bar.onclick=()=>{selectedId=t.id;switchView('gantt');editSelected();};
      timeline.appendChild(bar);
    });
    row.appendChild(timeline);
    list.appendChild(row);
  });
}

/* ===== Drag ===== */
let dragState=null;
function startDrag(e,task,bar,minD){
  e.preventDefault();
  dragState={task,bar,startX:e.clientX,origLeft:parseFloat(bar.style.left),origW:parseFloat(bar.style.width),isResize:e.offsetX>parseFloat(bar.style.width)-8,minD};
  document.onmousemove=onDrag;
  document.onmouseup=endDrag;
}
function onDrag(e){
  if(!dragState)return;
  const dx=e.clientX-dragState.startX;
  if(dragState.isResize) dragState.bar.style.width=Math.max(dayWidth,dragState.origW+dx)+'px';
  else dragState.bar.style.left=(dragState.origLeft+dx)+'px';
}
function endDrag(){
  if(!dragState)return;
  const {task,bar,origLeft,isResize}=dragState;
  if(isResize) task.duration=Math.max(0,Math.round(parseFloat(bar.style.width)/dayWidth));
  else {
    const days=Math.round((parseFloat(bar.style.left)-origLeft)/dayWidth);
    task.start=formatDate(addDays(parseDate(task.start),days));
  }
  dragState=null;
  document.onmousemove=document.onmouseup=null;
  rescheduleAll();
}

/* ===== Calendario ===== */
function switchView(v){
  currentView=v;
  document.getElementById('ganttView').classList.toggle('hidden',v!=='gantt');
  document.getElementById('resourceView').classList.toggle('active',v==='resources');
  document.getElementById('calendarView').classList.toggle('active',v==='calendar');
  render();
}
function changeCalMonth(d){
  calMonth+=d;
  if(calMonth>12){calMonth=1;calYear++;}
  if(calMonth<1){calMonth=12;calYear--;}
  renderCalendar();
}
function renderCalendar(){
  const title=document.getElementById('calTitle');
  const grid=document.getElementById('calGrid');
  const names=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  title.textContent=`${names[calMonth]} ${calYear}`;
  grid.innerHTML='';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d=>{
    const el=document.createElement('div');
    el.style.cssText='text-align:center;font-weight:600;padding:6px;background:#eee';
    el.textContent=d;grid.appendChild(el);
  });
  const first=new Date(calYear,calMonth-1,1);
  let startWD=first.getDay()||7;
  const daysInMonth=new Date(calYear,calMonth,0).getDate();
  for(let i=1;i<startWD;i++){const e=document.createElement('div');e.style.cssText='min-height:80px;background:#f0f0f0;border:1px solid #ddd';grid.appendChild(e);}
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');
    el.style.cssText='min-height:80px;border:1px solid #ddd;padding:4px;font-size:12px;background:#fafafa';
    el.innerHTML=`<div style="font-weight:600">${d}</div>`;
    const dateStr=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    tasks.forEach(t=>{
      if(!passesFilter(t)||t.summary)return;
      const s=parseDate(t.start),f=getFinish(t),c=parseDate(dateStr);
      if(c>=s&&c<=f){
        const ev=document.createElement('div');
        ev.style.cssText=`background:${t.critical?'var(--critical)':'#5b9bd5'};color:#fff;padding:1px 4px;margin:1px 0;border-radius:2px;font-size:10px;cursor:pointer`;
        ev.textContent=t.name;
        ev.onclick=()=>{selectedId=t.id;editSelected();};
        el.appendChild(ev);
      }
    });
    grid.appendChild(el);
  }
}

/* ===== Modal & CRUD ===== */
function addTask(){
  const id=Math.max(...tasks.map(t=>t.id))+1;
  tasks.push({id,name:"Nueva tarea",duration:5,start:formatDate(new Date()),percent:0,level:0,summary:false,resource:"",preds:[],collapsed:false,critical:false,baselineStart:null,baselineDuration:null});
  selectedId=id;render();editSelected();
}
function editSelected(){
  if(!selectedId)return alert('Selecciona una tarea');
  const t=tasks.find(x=>x.id===selectedId);
  editingId=t.id;
  document.getElementById('modalTitle').textContent=`Editar tarea #${t.id}`;
  document.getElementById('mName').value=t.name;
  document.getElementById('mDuration').value=t.duration;
  document.getElementById('mStart').value=t.start;
  document.getElementById('mPercent').value=t.percent;
  document.getElementById('mResource').value=t.resource||'';
  document.getElementById('mSummary').value=t.summary;
  const pl=document.getElementById('predList');
  pl.innerHTML='';
  (t.preds||[]).forEach((p,i)=>addPredRow(p.id,p.type,p.lag,i));
  document.getElementById('editModal').classList.add('show');
}
function addPredRow(id='',type='FS',lag=0){
  const div=document.createElement('div');
  div.className='pred-row';
  div.innerHTML=`
    <input type="number" placeholder="ID" value="${id}" style="width:70px">
    <select>
      <option value="FS" ${type==='FS'?'selected':''}>FS</option>
      <option value="SS" ${type==='SS'?'selected':''}>SS</option>
      <option value="FF" ${type==='FF'?'selected':''}>FF</option>
      <option value="SF" ${type==='SF'?'selected':''}>SF</option>
    </select>
    <input type="number" placeholder="Lag" value="${lag}" style="width:60px">
    <button onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('predList').appendChild(div);
}
function saveTask(){
  const t=tasks.find(x=>x.id===editingId);
  t.name=document.getElementById('mName').value;
  t.duration=parseInt(document.getElementById('mDuration').value)||0;
  t.start=document.getElementById('mStart').value;
  t.percent=parseInt(document.getElementById('mPercent').value)||0;
  t.resource=document.getElementById('mResource').value.trim();
  t.summary=document.getElementById('mSummary').value==='true';
  t.preds=[];
  document.querySelectorAll('#predList .pred-row').forEach(row=>{
    const inputs=row.querySelectorAll('input,select');
    const pid=parseInt(inputs[0].value);
    if(pid) t.preds.push({id:pid,type:inputs[1].value,lag:parseInt(inputs[2].value)||0});
  });
  closeModal();
  rescheduleAll();
}
function closeModal(){document.getElementById('editModal').classList.remove('show');}
function deleteSelected(){
  if(!selectedId||!confirm('¿Eliminar?'))return;
  tasks=tasks.filter(t=>t.id!==selectedId);
  selectedId=null;render();saveData();
}
function indentTask(){const t=tasks.find(x=>x.id===selectedId);if(t&&t.level<4){t.level++;render();saveData();}}
function outdentTask(){const t=tasks.find(x=>x.id===selectedId);if(t&&t.level>0){t.level--;render();saveData();}}
function toggleCollapse(id){const t=tasks.find(x=>x.id===id);t.collapsed=!t.collapsed;render();}
function toggleExpandAll(e){tasks.forEach(t=>{if(t.summary)t.collapsed=!e;});render();}
function changeScale(v){scale=v;render();}
function calculateCriticalPath(){
  tasks.forEach(t=>t.critical=false);
  const leaves=tasks.filter(t=>!tasks.some(x=>x.preds&&x.preds.some(p=>p.id===t.id)));
  leaves.forEach(leaf=>{
    let cur=leaf;
    while(cur){
      cur.critical=true;
      const predId=cur.preds&&cur.preds[0]?cur.preds[0].id:null;
      cur=tasks.find(x=>x.id===predId);
    }
  });
  render();
}
function setBaseline(){
  if(!confirm('¿Establecer Baseline?'))return;
  tasks.forEach(t=>{t.baselineStart=t.start;t.baselineDuration=t.duration;});
  render();saveData();
}
function exportCSV(){
  let csv='ID,Nombre,Duración,Inicio,Fin,%,Recurso,Predecesoras,Crítica\n';
  tasks.forEach(t=>{
    const pred=(t.preds||[]).map(p=>`${p.id}${p.type}${p.lag||''}`).join(';');
    csv+=`${t.id},"${t.name}",${t.duration},${t.start},${formatDate(getFinish(t))},${t.percent},"${t.resource||''}","${pred}",${t.critical}\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='wellmont-pro.csv';a.click();
}
function showTooltip(e,t){
  const tip=document.getElementById('tooltip');
  const pred=(t.preds||[]).map(p=>`#${p.id} ${p.type}${p.lag?((p.lag>0?'+':'')+p.lag+'d'):''}`).join(', ')||'Ninguna';
  tip.innerHTML=`<b>${t.name}</b><br>Duración: ${t.duration}d<br>${t.start} → ${formatDate(getFinish(t))}<br>Avance: ${t.percent}%<br>Recurso: ${t.resource||'—'}<br>Predecesoras: ${pred}`;
  tip.style.display='block';
  tip.style.left=(e.clientX+14)+'px';
  tip.style.top=(e.clientY+14)+'px';
}
function hideTooltip(){document.getElementById('tooltip').style.display='none';}
function saveData(){
  localStorage.setItem('wellmont-pro',JSON.stringify(tasks));
  document.getElementById('status').textContent='Guardado '+new Date().toLocaleTimeString();
}
function loadData(){
  const s=localStorage.getItem('wellmont-pro');
  if(s){tasks=JSON.parse(s);document.getElementById('status').textContent='Datos restaurados';}
}

loadData();
render();
</script>
