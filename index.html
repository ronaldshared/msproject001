<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WELLMONT-11 – MS Project Pro + CPM + XML Export</title>
<style>
  :root {
    --header-bg: #f3f3f3;
    --border: #c0c0c0;
    --critical: #e74c3c;
    --bar-blue: #5b9bd5;
    --summary: #2c3e50;
    --baseline: #9e9e9e;
    --overalloc: #ff5252;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#e8e8e8;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  .toolbar{background:#2b579a;color:#fff;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
  .toolbar button,.toolbar select{background:#3b6db0;color:#fff;border:1px solid #1e3f6f;padding:5px 10px;border-radius:3px;cursor:pointer}
  .toolbar button:hover{background:#4a7bc8}
  .toolbar button:disabled{opacity:.5;cursor:not-allowed}
  .toolbar .sep{width:1px;height:22px;background:#5a8ad0;margin:0 4px}

  .main{flex:1;display:flex;overflow:hidden}
  .left-panel{width:940px;background:#fff;border-right:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .right-panel{flex:1;overflow:auto;background:#fff;position:relative}

  .grid-header{display:grid;grid-template-columns:34px 1.4fr 55px 85px 85px 45px 95px 130px 70px 55px 55px;background:var(--header-bg);border-bottom:1px solid var(--border);font-weight:600;font-size:11.5px;position:sticky;top:0;z-index:20}
  .grid-header>div{padding:6px 3px;border-right:1px solid var(--border)}

  .task-row{display:grid;grid-template-columns:34px 1.4fr 55px 85px 85px 45px 95px 130px 70px 55px 55px;border-bottom:1px solid #e0e0e0;font-size:12px;height:28px;align-items:center}
  .task-row:hover{background:#f0f7ff}
  .task-row.selected{background:#d6eaf8}
  .task-row.summary{font-weight:600;background:#f7f7f7}
  .task-row .id{text-align:center;color:#666}
  .task-row .name{padding-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-row .slack{text-align:center}
  .task-row .slack.zero{color:#c0392b;font-weight:600}

  .timeline-header{display:flex;background:var(--header-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15;height:44px}
  .month-cell{border-right:1px solid var(--border);text-align:center;font-size:12px;font-weight:600;padding-top:4px}

  .bars-container{position:relative}
  .bar-row{height:28px;position:relative;border-bottom:1px solid #f0f0f0}
  .bar{position:absolute;height:15px;top:6px;border-radius:3px;color:#fff;font-size:10px;line-height:15px;text-align:center;cursor:move;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.2);overflow:hidden;white-space:nowrap;z-index:3}
  .bar.critical{background:var(--critical)!important}
  .bar.summary-bar{background:var(--summary);height:8px;top:9px}
  .bar .progress{position:absolute;left:0;top:0;height:100%;background:rgba(0,0,0,.28)}
  .milestone{width:11px;height:11px;background:#2c3e50;transform:rotate(45deg);top:8px}
  .baseline-bar{position:absolute;height:4px;top:20px;background:var(--baseline);border-radius:1px;opacity:.7;z-index:1}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;z-index:6;pointer-events:none}
  #depSvg{position:absolute;top:0;left:0;pointer-events:none;z-index:4}

  .resource-view{display:none}.resource-view.active{display:block}
  .res-header{display:grid;grid-template-columns:200px 1fr;background:var(--header-bg);font-weight:600;padding:8px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .res-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid #eee;min-height:38px}
  .res-name{padding:9px;font-weight:600;background:#f8f8f8;border-right:1px solid var(--border)}
  .res-name.overallocated{background:#ffebee;color:#c62828}
  .res-timeline{position:relative;height:100%}
  .res-bar{position:absolute;height:15px;top:11px;border-radius:3px;font-size:10px;color:#fff;line-height:15px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer}
  .res-bar.over{background:var(--overalloc)!important}

  .gantt-view.hidden{display:none}
  .calendar-view{display:none;padding:16px}.calendar-view.active{display:block}

  .context-menu{position:fixed;background:#fff;border:1px solid #aaa;box-shadow:2px 2px 8px rgba(0,0,0,.2);z-index:1000;display:none;min-width:200px;font-size:13px}
  .context-menu div{padding:8px 14px;cursor:pointer}
  .context-menu div:hover{background:#e8f0fe}
  .context-menu .sep{height:1px;background:#ddd;margin:4px 0;padding:0}

  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center}
  .modal.show{display:flex}
  .modal-content{background:#fff;padding:20px;border-radius:6px;width:580px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto}
  .modal-content h3{margin-bottom:12px}
  .modal-content label{display:block;margin:8px 0 2px;font-size:13px}
  .modal-content input,.modal-content select{width:100%;padding:6px;margin-bottom:6px}
  .pred-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

  .tooltip{position:fixed;background:#1e1e1e;color:#fff;padding:8px 12px;border-radius:4px;font-size:12px;z-index:200;display:none;max-width:340px;pointer-events:none;line-height:1.4}
</style>
</head>

<div class="main">
  <div class="left-panel">
    <div class="grid-header">

<script>
/* ===================== ESTADO + HISTORIAL ===================== */
let tasks = [];
let selectedId = null;
let scale = 'week';
let dayWidth = 11;
let currentFilter = 'all';
let currentView = 'gantt';
let calYear = 2019, calMonth = 6;
let editingId = null;

let history = [];
let historyIndex = -1;
const MAX_HISTORY = 40;

function pushHistory() {
  history = history.slice(0, historyIndex + 1);
  history.push(JSON.stringify(tasks));
  if (history.length > MAX_HISTORY) history.shift();
  else historyIndex++;
  updateUndoRedoButtons();
}
function undo() {
  if (historyIndex <= 0) return;
  historyIndex--;
  tasks = JSON.parse(history[historyIndex]);
  render();
  updateUndoRedoButtons();
}
function redo() {
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  tasks = JSON.parse(history[historyIndex]);
  render();
  updateUndoRedoButtons();
}
function updateUndoRedoButtons() {
  document.getElementById('btnUndo').disabled = historyIndex <= 0;
  document.getElementById('btnRedo').disabled = historyIndex >= history.length - 1;
}

/* ===================== CALENDARIO LABORAL ===================== */
function isWorkingDay(date) {
  const day = date.getDay();
  return day !== 0 && day !== 6;
}
function addWorkingDays(startDate, days) {
  if (days === 0) return new Date(startDate);
  let result = new Date(startDate);
  let added = 0;
  const direction = days > 0 ? 1 : -1;
  const absDays = Math.abs(days);
  while (added < absDays) {
    result.setDate(result.getDate() + direction);
    if (isWorkingDay(result)) added++;
  }
  return result;
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

/* ===================== UTILIDADES ===================== */
const parseDate = s => new Date(s + 'T00:00:00');
const formatDate = d => d.toISOString().slice(0,10);
const getFinish = t => addWorkingDays(parseDate(t.start), t.duration);

function calculateStartFromPred(task, predTask, type, lag) {
  const pStart = parseDate(predTask.start);
  const pFinish = getFinish(predTask);
  switch(type) {
    case 'FS': return addWorkingDays(pFinish, lag);
    case 'SS': return addWorkingDays(pStart, lag);
    case 'FF': return addWorkingDays(addWorkingDays(pFinish, lag), -task.duration);
    case 'SF': return addWorkingDays(addWorkingDays(pStart, lag), -task.duration);
    default: return addWorkingDays(pFinish, lag);
  }
}

/* ===================== CPM ===================== */
function runCPM() {
  tasks.forEach(t => { t.es = 0; t.ef = t.duration; });

  let changed = true, safety = 0;
  while (changed && safety < 50) {
    changed = false; safety++;
    tasks.forEach(t => {
      if (!t.preds || !t.preds.length) return;
      let maxES = 0;
      t.preds.forEach(p => {
        const pred = tasks.find(x => x.id === p.id);
        if (!pred) return;
        let candidate = 0;
        if (p.type === 'FS') candidate = pred.ef + (p.lag || 0);
        else if (p.type === 'SS') candidate = pred.es + (p.lag || 0);
        else if (p.type === 'FF') candidate = pred.ef + (p.lag || 0) - t.duration;
        else if (p.type === 'SF') candidate = pred.es + (p.lag || 0) - t.duration;
        if (candidate > maxES) maxES = candidate;
      });
      if (maxES > t.es) {
        t.es = maxES;
        t.ef = t.es + t.duration;
        changed = true;
      }
    });
  }

  const projectEF = Math.max(...tasks.map(t => t.ef), 0);
  tasks.forEach(t => {
    t.lf = projectEF;
    t.ls = t.lf - t.duration;
  });

  changed = true; safety = 0;
  while (changed && safety < 50) {
    changed = false; safety++;
    for (let i = tasks.length - 1; i >= 0; i--) {
      const t = tasks[i];
      const successors = tasks.filter(s => (s.preds || []).some(p => p.id === t.id));
      if (successors.length === 0) continue;
      let minLS = Infinity;
      successors.forEach(s => {
        const link = s.preds.find(p => p.id === t.id);
        let candidate = s.ls - (link.lag || 0);
        if (candidate < minLS) minLS = candidate;
      });
      if (minLS < t.lf) {
        t.lf = minLS;
        t.ls = t.lf - t.duration;
        changed = true;
      }
    }
  }

  tasks.forEach(t => {
    t.totalSlack = t.ls - t.es;
    const successors = tasks.filter(s => (s.preds || []).some(p => p.id === t.id));
    if (successors.length === 0) t.freeSlack = t.totalSlack;
    else {
      const minSuccES = Math.min(...successors.map(s => s.es));
      t.freeSlack = Math.max(0, minSuccES - t.ef);
    }
    t.critical = t.totalSlack <= 0;
  });
  render();
}

/* ===================== RESCHEDULE ===================== */
function rescheduleAll() {
  let changed = true, safety = 0;
  while (changed && safety < 40) {
    changed = false; safety++;
    tasks.forEach(t => {
      if (!t.preds || !t.preds.length) return;
      let latest = null;
      t.preds.forEach(p => {
        const pred = tasks.find(x => x.id === p.id);
        if (!pred) return;
        const cand = calculateStartFromPred(t, pred, p.type, p.lag || 0);
        if (!latest || cand > latest) latest = cand;
      });
      if (latest) {
        const ns = formatDate(latest);
        if (ns !== t.start) { t.start = ns; changed = true; }
      }
    });
  }
  runCPM();
}

/* ===================== EXPORTAR XML MICROSOFT PROJECT ===================== */
function exportMSProjectXML() {
  const escapeXml = (str) => String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // Recursos únicos
  const resourceNames = [...new Set(tasks.filter(t => t.resource).map(t => t.resource))];
  const resourceMap = {};
  resourceNames.forEach((name, i) => resourceMap[name] = i + 1);

  let xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Project xmlns="http://schemas.microsoft.com/project">
  <SaveVersion>14</SaveVersion>
  <Name>WELLMONT-11</Name>
  <Title>WELLMONT-11</Title>
  <Company>Gantt Web Pro</Company>
  <Author>Grok Export</Author>
  <CreationDate>${new Date().toISOString()}</CreationDate>
  <ScheduleFromStart>1</ScheduleFromStart>
  <StartDate>${tasks.length ? tasks[0].start : '2019-06-01'}T08:00:00</StartDate>
  <FYStartDate>1</FYStartDate>
  <CriticalSlackLimit>0</CriticalSlackLimit>
  <CurrencyDigits>2</CurrencyDigits>
  <CurrencySymbol>$</CurrencySymbol>
  <CurrencyCode>USD</CurrencyCode>
  <CalendarUID>1</CalendarUID>
  <DefaultStartTime>08:00:00</DefaultStartTime>
  <DefaultFinishTime>17:00:00</DefaultFinishTime>
  <MinutesPerDay>480</MinutesPerDay>
  <MinutesPerWeek>2400</MinutesPerWeek>
  <DaysPerMonth>20</DaysPerMonth>
  <DefaultTaskType>0</DefaultTaskType>
  <DefaultFixedCostAccrual>2</DefaultFixedCostAccrual>
  <DefaultTaskEVMethod>0</DefaultTaskEVMethod>
  <ProjectExternallyEdited>0</ProjectExternallyEdited>

  <Calendars>
    <Calendar>
      <UID>1</UID>
      <Name>Standard</Name>
      <IsBaseCalendar>1</IsBaseCalendar>
      <BaseCalendarUID>-1</BaseCalendarUID>
      <WeekDays>
        <WeekDay><DayType>1</DayType><DayWorking>0</DayWorking></WeekDay>
        <WeekDay><DayType>2</DayType><DayWorking>1</DayWorking>
          <WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>
          <WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>
        </WeekDay>
        <WeekDay><DayType>3</DayType><DayWorking>1</DayWorking>
          <WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>
          <WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>
        </WeekDay>
        <WeekDay><DayType>4</DayType><DayWorking>1</DayWorking>
          <WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>
          <WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>
        </WeekDay>
        <WeekDay><DayType>5</DayType><DayWorking>1</DayWorking>
          <WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>
          <WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>
        </WeekDay>
        <WeekDay><DayType>6</DayType><DayWorking>1</DayWorking>
          <WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>
          <WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>
        </WeekDay>
        <WeekDay><DayType>7</DayType><DayWorking>0</DayWorking></WeekDay>
      </WeekDays>
    </Calendar>
  </Calendars>

  <Tasks>
`;

  tasks.forEach((t, index) => {
    const start = t.start + 'T08:00:00';
    const finish = formatDate(getFinish(t)) + 'T17:00:00';
    const outlineLevel = (t.level || 0) + 1;
    const isSummary = t.summary ? 1 : 0;
    const isMilestone = t.duration === 0 ? 1 : 0;
    const percent = t.percent || 0;

    xml += `    <Task>
      <UID>${t.id}</UID>
      <ID>${index + 1}</ID>
      <Name>${escapeXml(t.name)}</Name>
      <Type>0</Type>
      <IsNull>0</IsNull>
      <OutlineLevel>${outlineLevel}</OutlineLevel>
      <OutlineNumber>${outlineLevel}</OutlineNumber>
      <WBS>${t.id}</WBS>
      <Summary>${isSummary}</Summary>
      <Critical>${t.critical ? 1 : 0}</Critical>
      <Priority>500</Priority>
      <Start>${start}</Start>
      <Finish>${finish}</Finish>
      <Duration>PT${t.duration * 8}H0M0S</Duration>
      <DurationFormat>7</DurationFormat>
      <Work>PT${t.duration * 8}H0M0S</Work>
      <PercentComplete>${percent}</PercentComplete>
      <PercentWorkComplete>${percent}</PercentWorkComplete>
      <Milestone>${isMilestone}</Milestone>
      <FixedCostAccrual>2</FixedCostAccrual>
      <ConstraintType>0</ConstraintType>
      <CalendarUID>-1</CalendarUID>
`;

    // Predecessors
    if (t.preds && t.preds.length) {
      t.preds.forEach((p, i) => {
        // MS Project Link types: 0=FF, 1=FS, 2=SF, 3=SS
        let linkType = 1; // FS
        if (p.type === 'SS') linkType = 3;
        else if (p.type === 'FF') linkType = 0;
        else if (p.type === 'SF') linkType = 2;

        xml += `      <PredecessorLink>
        <PredecessorUID>${p.id}</PredecessorUID>
        <Type>${linkType}</Type>
        <CrossProject>0</CrossProject>
        <LinkLag>${(p.lag || 0) * 4800}</LinkLag>
        <LagFormat>7</LagFormat>
      </PredecessorLink>
`;
      });
    }

    xml += `    </Task>
`;
  });

  xml += `  </Tasks>

  <Resources>
`;

  resourceNames.forEach((name, i) => {
    xml += `    <Resource>
      <UID>${i + 1}</UID>
      <ID>${i + 1}</ID>
      <Name>${escapeXml(name)}</Name>
      <Type>1</Type>
      <IsNull>0</IsNull>
      <MaxUnits>1.00</MaxUnits>
      <PeakUnits>1.00</PeakUnits>
      <OverAllocated>0</OverAllocated>
      <CanLevel>1</CanLevel>
      <AccrueAt>3</AccrueAt>
    </Resource>
`;
  });

  xml += `  </Resources>

  <Assignments>
`;

  let assignUID = 1;
  tasks.forEach(t => {
    if (!t.resource || !resourceMap[t.resource]) return;
    const resUID = resourceMap[t.resource];
    const start = t.start + 'T08:00:00';
    const finish = formatDate(getFinish(t)) + 'T17:00:00';

    xml += `    <Assignment>
      <UID>${assignUID++}</UID>
      <TaskUID>${t.id}</TaskUID>
      <ResourceUID>${resUID}</ResourceUID>
      <PercentWorkComplete>${t.percent || 0}</PercentWorkComplete>
      <Units>1.0</Units>
      <Work>PT${t.duration * 8}H0M0S</Work>
      <Start>${start}</Start>
      <Finish>${finish}</Finish>
    </Assignment>
`;
  });

  xml += `  </Assignments>
</Project>`;

  // Descargar
  const blob = new Blob([xml], { type: 'application/xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'WELLMONT-11.xml';
  a.click();
  URL.revokeObjectURL(a.href);

  alert('Archivo XML generado.\nÁbrelo con Microsoft Project (Archivo → Abrir → seleccionar el .xml)');
}

function passesFilter(t) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'critical') return t.critical;
  if (currentFilter === 'incomplete') return t.percent < 100;
  if (currentFilter === 'completed') return t.percent === 100;
  if (currentFilter === 'delayed') return t.baselineStart && parseDate(t.start) > parseDate(t.baselineStart);
  return true;
}

function isHidden(task) {
  let level = task.level;
  for (let i = tasks.indexOf(task) - 1; i >= 0; i--) {
    if (tasks[i].level < level) {
      if (tasks[i].collapsed) return true;
      level = tasks[i].level;
    }
  }
  return false;
}

function render() {
  if (currentView === 'gantt') {
    renderTaskList();
    renderTimeline();
    drawDependencies();
  } else if (currentView === 'resources') {
    renderResourceView();
  } else {
    renderCalendar();
  }
}

    ];
  }
  history = [JSON.stringify(tasks)];
  historyIndex = 0;
  updateUndoRedoButtons();

}
